server:
  port: 8080

spring:
  application:
    name: asset-approval-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/asset_approval?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456

# Flowable 工作流配置：启动时自动在 MySQL 中建表并部署 processes 目录下的流程图
flowable:
  database-schema-update: true
  async-executor-activate: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
